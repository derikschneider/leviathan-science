<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link rel="stylesheet" href="./src/index.css" />

  </head>
  <body>

    <!--
    <my-element>
      <h1>Vite + Lit</h1>
    </my-element>
  -->
    <script type="module">
      const root = document.documentElement;

      const wght = document.getElementById("wght");
      const wdth = document.getElementById("wdth");
      const wghtVal = document.getElementById("wghtVal");
      const wdthVal = document.getElementById("wdthVal");

      function apply() {
        root.style.setProperty("--ls-wght", wght.value);
        root.style.setProperty("--ls-wdth", wdth.value);
        wghtVal.textContent = wght.value;
        wdthVal.textContent = wdth.value;
        console.log(wght.value, wdth.value);
      }

      wght.addEventListener("input", apply);
      wdth.addEventListener("input", apply);
      
      apply();
    </script>
  </body>
  
</html>
